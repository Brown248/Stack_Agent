name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Sample backend passes its own guard, map, and verify
        run: |
          node scripts/guard.mjs --root examples/sample-backend
          node scripts/api-map.mjs --root examples/sample-backend
          node scripts/verify.mjs --root examples/sample-backend
